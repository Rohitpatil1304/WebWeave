<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebWeave Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <h1>WebWeave Session Dashboard</h1>
          <p>Large interactive graph of your live browsing session.</p>
        </div>
        <div class="hero-actions">
          <button id="startSession">Start Session</button>
          <button id="stopSession" class="ghost">Stop Session</button>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <section class="tools">
        <div class="tool-row path-row">
          <input id="fromUrl" type="text" list="urlSuggestions" autocomplete="off" placeholder="From URL (start node)" />
          <input id="toUrl" type="text" list="urlSuggestions" autocomplete="off" placeholder="To URL (destination node)" />
          <button id="findPath">Find BFS Path</button>
        </div>
        <datalist id="urlSuggestions"></datalist>
        <p class="helper">From URL is where the path starts. To URL is where the path should end.</p>
        <p id="pathResult"></p>
      </section>

      <section class="graph-shell">
        <svg id="graph" viewBox="0 0 1500 860" preserveAspectRatio="xMidYMid meet"></svg>
      </section>

      <footer class="footnote">Click any node to jump to the exact page.</footer>
    </main>

    <script src="popup/d3.v7.min.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
